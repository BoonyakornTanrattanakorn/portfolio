<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boonyakorn Tanrattanakorn — Computer Engineering Portfolio</title>
    <link rel="icon" href="/site/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var dark = s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/src/entry-client.jsx"></script>
  </body>
</html>
