<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portfolio — Boonyakorn Tanrattanakorn</title>
    <meta name="description" content="Selected engineering projects by Boonyakorn Tanrattanakorn — embedded systems, FPGA, simulation, and full-stack web." />
    <meta property="og:title" content="Portfolio — Boonyakorn Tanrattanakorn" />
    <meta property="og:description" content="Selected engineering projects: embedded systems, FPGA, simulation, full-stack." />
    <meta property="og:image" content="https://media.licdn.com/dms/image/v2/D5603AQEQGrzVBFih9Q/profile-displayphoto-scale_400_400/B56ZuRTigjJcAk-/0/1767669377827?e=1793836800&v=beta&t=B8Ipi5LafP6Y2n9BXm6AyiV4DUIUaj1ZjJ0nEMoP5FI" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script>
      (function () {
        var s = localStorage.getItem('theme');
        var dark = s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-container"></div>

      <main class="app-content">
        <div class="wrap">
          <section>
            <h1 style="margin:8px 0 4px">Portfolio</h1>
            <p class="lead">Selected projects and highlights. Click a card to read more.</p>
          </section>

          <section style="margin-top:12px" class="controls">
            <input id="search" type="search" placeholder="Search projects (title, summary, tags)" aria-label="Search projects" />

            <label for="sort" style="margin-left:8px">Sort:</label>
            <select id="sort" aria-label="Sort projects">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="az">Title A–Z</option>
              <option value="za">Title Z–A</option>
            </select>

            <div id="tag-filters" style="display:inline-block;margin-left:12px"></div>
          </section>

          <section class="grid" id="project-grid">
            <p class="loading">Loading projects…</p>
          </section>
        </div>
      </main>
    </div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/collection.js"></script>
    <script>
      initCollection({
        manifest: 'projects/projects.json',
        base: 'projects/',
        noun: 'projects',
        cardHref: (id) => `projects/${id}/index.html`,
      });
    </script>
  </body>
</html>
