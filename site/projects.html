<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portfolio — Boonyakorn Tanrattanakorn</title>
    <meta name="description" content="Selected engineering projects by Boonyakorn Tanrattanakorn — embedded systems, FPGA, simulation, and full-stack web." />
    <meta property="og:title" content="Portfolio — Boonyakorn Tanrattanakorn" />
    <meta property="og:description" content="Selected engineering projects: embedded systems, FPGA, simulation, full-stack." />
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/156056911?v=4" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script>
      (function () {
        var s = localStorage.getItem('theme');
        var dark = s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-container"></div>

      <main class="app-content">
        <div class="wrap">
          <section>
            <h1 style="margin:8px 0 4px">Portfolio</h1>
            <p class="lead">Selected projects and highlights. Click a card to read more.</p>
          </section>

          <section style="margin-top:12px" class="controls">
            <input id="search" type="search" placeholder="Search projects (title, summary, tags)" aria-label="Search projects" />

            <label for="sort" style="margin-left:8px">Sort:</label>
            <select id="sort" aria-label="Sort projects">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="az">Title A–Z</option>
              <option value="za">Title Z–A</option>
            </select>

            <div id="tag-filters" style="display:inline-block;margin-left:12px"></div>
          </section>

          <section class="grid" id="project-grid">
            <p class="loading">Loading projects…</p>
          </section>
        </div>
      </main>
    </div>

    <script src="assets/js/theme.js"></script>
    <script>
      /** Project loader + search / sort / filter UI */
      const PROJECT_BASE = 'projects/';

      const grid = document.getElementById('project-grid');
      const searchInput = document.getElementById('search');
      const sortSelect = document.getElementById('sort');
      const tagFilters = document.getElementById('tag-filters');

      let projects = [];
      let selectedTags = new Set();

      function renderCard(id, meta) {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `${PROJECT_BASE}${id}/index.html`;
        card.setAttribute('aria-label', meta.title || id);

        if (meta.thumbnail) {
          const img = document.createElement('img');
          img.className = 'card-thumb';
          img.src = `${PROJECT_BASE}${id}/${String(meta.thumbnail).trim()}`;
          img.alt = `${meta.title || id} thumbnail`;
          img.loading = 'lazy';
          img.onerror = () => {
            const ph = document.createElement('div');
            ph.className = 'card-thumb-placeholder';
            ph.textContent = 'No image';
            if (img.parentNode) img.parentNode.replaceChild(ph, img);
          };
          card.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'card-thumb-placeholder';
          ph.textContent = 'No image';
          card.appendChild(ph);
        }

        const body = document.createElement('div');
        body.className = 'card-body';

        const h3 = document.createElement('h3');
        h3.textContent = meta.title || id;
        body.appendChild(h3);

        const metaDiv = document.createElement('div');
        metaDiv.className = 'card-meta';
        metaDiv.innerHTML = `${meta.date || ''} &nbsp;·&nbsp; ${meta.organization || ''} &nbsp;·&nbsp; ${meta.role || ''}`;
        body.appendChild(metaDiv);

        const p = document.createElement('p');
        p.textContent = meta.summary || '';
        body.appendChild(p);

        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'tags';
        (meta.tags || []).forEach((t) => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = t;
          tagsDiv.appendChild(span);
        });
        body.appendChild(tagsDiv);

        card.appendChild(body);
        return card;
      }

      function normalize(s) { return String(s || '').toLowerCase(); }

      function parseDateValue(d) {
        if (!d) return 0;
        const parsed = Date.parse(d);
        if (!Number.isNaN(parsed)) return parsed;
        const year = parseInt(d, 10);
        if (!Number.isNaN(year)) return new Date(year, 0, 1).getTime();
        return 0;
      }

      function getAllTags(items) {
        const set = new Set();
        items.forEach((p) => (p.meta.tags || []).forEach((t) => set.add(t)));
        return Array.from(set).sort((a, b) => a.localeCompare(b));
      }

      function createTagFilters(tags) {
        tagFilters.innerHTML = '';
        if (!tags.length) return;
        tags.forEach((t) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tag-filter';
          btn.textContent = t;
          btn.dataset.tag = t;
          btn.addEventListener('click', () => {
            if (selectedTags.has(t)) selectedTags.delete(t); else selectedTags.add(t);
            btn.classList.toggle('active');
            renderProjects();
          });
          tagFilters.appendChild(btn);
        });
      }

      function matchesQuery(p, q) {
        if (!q) return true;
        q = normalize(q);
        if (normalize(p.meta.title).includes(q)) return true;
        if (normalize(p.meta.summary).includes(q)) return true;
        if (normalize(p.meta.organization).includes(q)) return true;
        if (normalize(p.meta.role).includes(q)) return true;
        for (const t of (p.meta.tags || [])) if (normalize(t).includes(q)) return true;
        return false;
      }

      function renderProjects() {
        const q = searchInput.value.trim();
        const sort = sortSelect.value;

        const filtered = projects.filter((p) => {
          if (p.error) return false;
          if (!matchesQuery(p, q)) return false;
          if (selectedTags.size > 0) {
            const tags = p.meta.tags || [];
            const has = Array.from(selectedTags).some((t) => tags.indexOf(t) !== -1);
            if (!has) return false;
          }
          return true;
        });

        filtered.sort((a, b) => {
          if (sort === 'az') return (a.meta.title || '').localeCompare(b.meta.title || '');
          if (sort === 'za') return (b.meta.title || '').localeCompare(a.meta.title || '');
          const da = parseDateValue(a.meta.date);
          const db = parseDateValue(b.meta.date);
          return sort === 'oldest' ? da - db : db - da;
        });

        grid.innerHTML = '';
        if (!filtered.length) {
          grid.innerHTML = `<p class="loading">No projects found.</p>`;
          return;
        }
        filtered.forEach((p) => grid.appendChild(renderCard(p.id, p.meta)));
      }

      function debounce(fn, ms = 200) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
      }

      async function loadProjects() {
        try {
          const manifestRes = await fetch(`${PROJECT_BASE}projects.json`);
          if (!manifestRes.ok) throw new Error(`projects.json: ${manifestRes.status}`);
          const ids = await manifestRes.json();

          const metas = await Promise.all(
            ids.map((id) =>
              fetch(`${PROJECT_BASE}${id}/meta.json`)
                .then((r) => { if (!r.ok) throw new Error(`${id}/meta.json: ${r.status}`); return r.json(); })
                .then((meta) => ({ id, meta }))
                .catch((err) => ({ id, error: err.message }))
            )
          );

          projects = metas;

          const errors = projects.filter((p) => p.error);
          if (errors.length) {
            const errFrag = document.createDocumentFragment();
            errors.forEach((e) => {
              const el = document.createElement('p');
              el.className = 'error-msg';
              el.textContent = `Could not load "${e.id}": ${e.error}`;
              errFrag.appendChild(el);
            });
            grid.innerHTML = '';
            grid.appendChild(errFrag);
          }

          createTagFilters(getAllTags(projects.filter((p) => !p.error)));
          renderProjects();
        } catch (err) {
          grid.innerHTML = `<p class="error-msg">Failed to load projects: ${err.message}</p>`;
        }
      }

      searchInput.addEventListener('input', debounce(renderProjects, 180));
      sortSelect.addEventListener('change', renderProjects);
      loadProjects();
    </script>
  </body>
</html>
