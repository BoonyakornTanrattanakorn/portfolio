<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Websites — Boonyakorn Tanrattanakorn</title>
    <meta name="description" content="Websites built by Boonyakorn Tanrattanakorn — live full-stack and front-end web applications." />
    <meta property="og:title" content="Websites — Boonyakorn Tanrattanakorn" />
    <meta property="og:description" content="Live websites and web applications." />
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/156056911?v=4" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script>
      (function () {
        var s = localStorage.getItem('theme');
        var dark = s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-container"></div>

      <main class="app-content">
        <div class="wrap">
          <section>
            <h1 style="margin:8px 0 4px">Websites</h1>
            <p class="lead">Sites I've built. Clicking a card opens the live site in a new tab.</p>
          </section>

          <section style="margin-top:12px" class="controls">
            <input id="search" type="search" placeholder="Search websites (title, summary, tags)" aria-label="Search websites" />

            <label for="sort" style="margin-left:8px">Sort:</label>
            <select id="sort" aria-label="Sort websites">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="az">Title A–Z</option>
              <option value="za">Title Z–A</option>
            </select>

            <div id="tag-filters" style="display:inline-block;margin-left:12px"></div>
          </section>

          <section class="grid" id="project-grid">
            <p class="loading">Loading websites…</p>
          </section>
        </div>
      </main>
    </div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/collection.js"></script>
    <script>
      initCollection({
        manifest: 'websites/websites.json',
        base: 'websites/',
        noun: 'websites',
        external: true,
        cardHref: (id, meta) => meta.url || '#',
        // Show a status pill (live / wip / archived) and dim archived screenshots.
        decorate: (card, body, meta) => {
          if (!meta.status) return;
          const pill = document.createElement('span');
          pill.className = `status-pill status-${String(meta.status).toLowerCase()}`;
          pill.textContent = meta.status;
          body.querySelector('h3').appendChild(pill);
          if (String(meta.status).toLowerCase() === 'archived') card.classList.add('is-archived');
        },
      });
    </script>
  </body>
</html>
