name: Render CV and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'CV/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          mkdir -p _site/CV
          # site/ holds the entire deployable site; its contents become the web root
          # so published URLs stay at /index.html, /assets/..., /projects/<id>/.
          cp -r site/. _site/
          # Markdown notes live alongside the projects but are not part of the site.
          find _site -name "*.md" -delete
          find CV -name "*.html" -exec cp {} _site/CV/Boonyakorn_Tanrattanakorn_CV.html \;
          find CV -name "*.pdf" -exec cp {} _site/CV/Boonyakorn_Tanrattanakorn_CV.pdf \; || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
